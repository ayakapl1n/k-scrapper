# .github/workflows/scrape_links.yml
name: Scrape Kolesa Links

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 03:00 UTC (08:00 Asia/Almaty)
    - cron: '0 3 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npx playwright install --with-deps

      - name: Run scraper script
        run: python links.py

      - name: Upload scraped links
        uses: actions/upload-artifact@v4
        with:
          name: scraped-links
          path: |
            links.csv
