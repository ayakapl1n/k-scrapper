name: Scrape & Commit Links

on:
  workflow_dispatch:

permissions:
  contents: write   # важно, чтобы workflow мог пушить

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (with write access)
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run scraper
        run: python links.py

      - name: Commit & Push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add links_playwright.csv checkpoint.txt
          if ! git diff --staged --quiet; then
            git commit -m "ci: update scraped links and checkpoint"
            git push
          else
            echo "No changes to commit."
          fi
